name: test

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      fail-fast: false
      matrix:
        # ARM Linux / ARM Windows intentionally omitted:
        # Raku/setup-raku@v1 lacks prebuilt Rakudo tarballs for those
        # platforms so we can't run Raku tests there. Tokenizers'
        # ARM prebuilts are validated via build-binaries.yml
        # (successful cargo build + correct symbol exports + checksum
        # in the release). ARM end-to-end picks up when upstream Raku
        # publishes ARM tarballs.
        os:
          - ubuntu-latest      # Linux x86_64 glibc
          - macos-latest       # macOS arm64 (universal dylib)
          - windows-latest     # Windows x86_64
        raku-version:
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}

      # ---------------------------------------------------------
      # Prebuilt path — no Rust toolchain installed yet. Proves the
      # prebuilt download + SHA verify + staging works without any
      # system deps beyond Raku itself. This is exactly the
      # `zef install Tokenizers` flow that end users hit.
      # ---------------------------------------------------------
      - name: Install Tokenizers via prebuilt path
        run: zef install --/test --test-depends .

      - name: Install App::Prove6
        run: zef install --/test App::Prove6

      - name: Run tests — prebuilt path
        run: prove6 --verbose t

      # ---------------------------------------------------------
      # Source-build fallback — install Rust + MSVC, then force a
      # cargo build to cover the path users without a supported
      # prebuilt platform end up on.
      # ---------------------------------------------------------
      - name: Install Rust toolchain (source-build fallback)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC (Windows source-build)
        if: runner.os == 'Windows'
        uses: m-doughty/msvc-dev-cmd@v1-node24

      - name: Install Tokenizers via source-build path
        env:
          TOKENIZERS_BUILD_FROM_SOURCE: '1'
        run: zef install --/test --test-depends --force-install .

      - name: Run tests — source-build path
        run: prove6 --verbose t
